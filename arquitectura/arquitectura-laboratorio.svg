    </marker>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Arquitectura del laboratorio de ciberseguridad</text>

  <!-- red -->
