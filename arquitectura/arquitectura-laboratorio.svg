  <line x1="552" y1="225" x2="638" y2="225" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
  <text x="595" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Logs</text>
